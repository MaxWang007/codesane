name: codesane
description: Scan the git diff for swallowed errors, type escapes, dropped guards, security loosenings, and unfinished stubs.
author: MaxWang007
branding:
  icon: shield
  color: red
inputs:
  base:
    description: Git ref to diff against. Defaults to codesane's own auto-detection. All-zero SHAs (first push of a branch) are ignored.
    required: false
    default: ""
  fail-on-warning:
    description: Treat warnings (including allowlisted findings) as failures.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Install and build codesane
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        if [ -f package-lock.json ]; then npm ci; else npm install; fi
        npm run build
    - name: Run codesane
      shell: bash
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE:-.}"
        args=(check --markdown)
        base="${{ inputs.base }}"
        # github.event.before is 40 zeros on the first push of a branch.
        if [ -n "$base" ] && [ -n "$(printf '%s' "$base" | tr -d '0')" ]; then
          args+=(--base "$base")
        fi
        if [ "${{ inputs.fail-on-warning }}" = "true" ]; then
          args+=(--fail-on-warning)
        fi
        node "${{ github.action_path }}/dist/cli.js" "${args[@]}"
