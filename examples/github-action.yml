# Drop this into .github/workflows/codesane.yml
#
# Findings appear as workflow annotations (file and line) and in the job
# summary. An all-zero `base` (first push of a new branch) is ignored, and
# codesane then auto-detects the default branch.
name: codesane

on:
  pull_request:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: MaxWang007/codesane@v0
        with:
          # PR: diff against the PR base. Push: diff against the previous tip.
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
