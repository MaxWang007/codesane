# Drop this into .github/workflows/codesane.yml
name: codesane

on:
  pull_request:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: MaxWang007/codesane@v0
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
